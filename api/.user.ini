; Bible Explorer: PHP settings for the /api folder only
; Used on cPanel setups where PHP runs as CGI/FastCGI/LiteSpeed
; (the most common setup today), which is what reads .user.ini files.
; If your host runs PHP as an Apache module instead, api/.htaccess has
; a matching fallback for that. Either way, no cPanel panel access is
; needed for this to take effect, it can take a few minutes to kick in
; the first time (PHP caches .ini files briefly), see
; api/check-limits.php to confirm the live values.
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 60
